<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #121212, #3a3a3a);
            font-family: 'Arial', sans-serif;
            color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .profile-container {
            max-width: 600px;
            margin: 50px auto;
            background: rgba(20, 20, 20, 0.95);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.4);
        }
        .profile-picture {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #4caf50;
            margin-bottom: 20px;
            background-color: #d9d9d9; /* Fallback for when the image isn't loaded */
        }
        .username {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .bio {
            font-size: 1rem;
            color: #b0b0b0;
            margin-bottom: 20px;
        }
        .action-buttons a {
            margin: 5px;
            text-decoration: none;
        }
        .btn-edit {
            background-color: #4caf50;
            border: none;
            color: white;
        }
        .btn-logout {
            background-color: #e74c3c;
            border: none;
            color: white;
        }
        .btn:hover {
            opacity: 0.9;
        }
        @media (max-width: 768px) {
            .profile-container {
                margin: 20px;
                padding: 20px;
            }
            .profile-picture {
                width: 140px;
                height: 140px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-container">
            <img 
                src="{{ user.userprofile.profile_picture.url }}" 
                alt="Profile Picture" 
                class="profile-picture"
                onerror="this.src='https://via.placeholder.com/180x180.png?text=No+Image';"
            >
            <div class="username">{{ user.username }}</div>
            <div class="bio">
                {{ user.userprofile.bio|default:"No bio available." }}
            </div>
            <div class="action-buttons">
                <a href="{% url 'edit_profile' %}" class="btn btn-edit px-4 py-2">Edit Profile</a>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-logout px-4 py-2 "> Logout
                    </button>
                  </form>
            </div>
        </div>
    </div>
</body>
</html>
