{% extends "base.html" %}
<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-TK5VJDRBD4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-TK5VJDRBD4');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title_block %}Contact us {% endblock %}</title>
  {% block content %}
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Custom Styles */
    body {
      background-color: #f0f4f8;
      font-family: 'Roboto', sans-serif;
    }

    .contact-header {
      background-color: #0d6efd;
      color: #fff;
      padding: 50px 0;
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 1px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
    }

    .contact-form {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      padding: 40px;
      margin-top: -50px;
    }

    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 5px rgba(13, 110, 253, 0.5);
    }

    .submit-btn {
      background-color: #0d6efd;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
      transition: background-color 0.3s ease;
    }

    .submit-btn:hover {
      background-color: #0056b3;
      box-shadow: 0 4px 15px rgba(0, 86, 179, 0.4);
    }

    .contact-info {
      margin-top: 40px;
      text-align: center;
      color: #0d6efd;
      font-size: 18px;
    }

    .contact-info a {
      color: #0d6efd;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    .contact-info a:hover {
      color: #0056b3;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Contact Header Section -->
  <div class="contact-header">
    Get in Touch
  </div>

  <!-- Contact Form Section -->
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="contact-form">
          <h2 class="text-center mb-4">We'd love to hear from you</h2>
          <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
              <label for="name" class="form-label">Your Name</label>
              <input type="text" name="username" class="form-control" id="name" placeholder="Enter your name">
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Your Email</label>
              <input type="email" name="mail" class="form-control" id="email" placeholder="Enter your email">
            </div>
            <div class="mb-3">
              <label for="message" class="form-label">Message</label>
              <textarea class="form-control" name="text" id="message" rows="4" placeholder="Write your message"></textarea>
            </div>
            <div class="text-center">
              <button type="submit" value="save" class="submit-btn">Send Message</button>
            </div>
          </form>
        </div>
        <!-- Contact Information -->
        <div class="contact-info mt-5">
          <p>For any inquiries, you can also reach us at:</p>
          <p>Email: <a href="mailto:shizaansiddiqui@outlook.com">shizaansiddiqui@outlook.com</a></p>
          <p>Phone: <a href="tel:+916386710148">+91 6386710148</a></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
</body>
</html>
