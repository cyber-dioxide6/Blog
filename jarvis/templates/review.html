{% extends "base.html" %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title_block %}Review{% endblock %}</title>
  {% block content %}
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Custom Styles */
    .review-section {
      background-color: #0a0f2c; /* Dark blue techy background */
      background-image: linear-gradient(135deg, #0a0f2c 0%, #112d46 100%);
      padding: 50px 0;
      color: #e9ecef; /* Techy light text */
    }

    .review-card {
      border: none;
      background-color: #1a1f3b;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      padding: 30px;
      margin-bottom: 30px;
    }

    .reviewer-name {
      font-weight: bold;
      font-size: 20px;
      color: #61dafb;
    }

    .review-date {
      font-size: 14px;
      color: #adb5bd;
    }

    .review-stars {
      color: #ffc107;
      font-size: 18px;
    }

    .review-content {
      font-size: 16px;
      color: #ced4da;
      margin-top: 15px;
    }

    .add-review-btn {
      background-color: #4a90e2;
      color: #fff;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    .add-review-btn:hover {
      background-color: #357ab8;
      box-shadow: 0 4px 15px rgba(53, 122, 184, 0.4);
    }

    .form-control:focus {
      border-color: #61dafb;
      box-shadow: 0 0 5px rgba(97, 218, 251, 0.5);
    }

    .rating-stars input[type="radio"] {
      display: none;
    }

    .rating-stars label {
      font-size: 24px;
      color: #ccc;
      cursor: pointer;
    }

    .rating-stars input[type="radio"]:checked ~ label {
      color: #ffc107;
    }

    .rating-stars input[type="radio"]:hover ~ label {
      color: #ffc107;
    }

    .rating-stars label:hover ~ label {
      color: #ffc107;
    }
  </style>
</head>
<body>

  <!-- Review Section -->
  <section class="review-section">
    <div class="container">
      <h2 class="text-center mb-5">What Our Readers Are Saying</h2>
      <div class="row">
        <!-- Review 1 -->
        {% for rev in rev %}
        <div class="col-md-4">
          <div class="review-card">
            <div class="d-flex justify-content-between">
              <div>
                <p class="reviewer-name">{{rev.name}}</p>
                <p class="review-date">Reviewed on {{rev.date}}</p>
              </div>
            </div>
            <p class="review-content">{{rev.feedback|truncatewords:50}}</p>
          </div>
        </div>
        {% endfor %}
        
         
      </div>
      
      <!-- Review Form -->
      <h3 class="text-center mt-5">Submit Your Review</h3>
      <div class="row justify-content-center mt-4">
        <div class="col-md-6">
          <div class="review-card">
            <form method="post" enctype="multipart/form-data">
              {% csrf_token %}
              <div class="mb-3">
                <label for="reviewerName" class="form-label">Your Name</label>
                <input type="text" class="form-control" id="reviewerName" placeholder="Enter your name" name="name">
              </div>
              <div class="mb-3">
                <label for="reviewerEmail" class="form-label">Your Email</label>
                <input type="email" class="form-control" id="reviewerEmail" placeholder="Enter your email" name="email">
              </div>
              <div class="mb-3">
                <label for="reviewContent" class="form-label">Your Review</label>
                <textarea class="form-control" id="reviewContent" rows="4" placeholder="Write your review" name="feedback"></textarea>
              </div>

              <!-- Star Rating -->
             <!-- <div class="mb-3">
                <label class="form-label">Rating</label>
                <div class="rating-stars">
                  <input type="radio" name="rating" id="star5" value="5">
                  <label for="star5">&#9733;</label>
                  <input type="radio" name="rating" id="star4" value="4">
                  <label for="star4">&#9733;</label>
                  <input type="radio" name="rating" id="star3" value="3">
                  <label for="star3">&#9733;</label>
                  <input type="radio" name="rating" id="star2" value="2">
                  <label for="star2">&#9733;</label>
                  <input type="radio" name="rating" id="star1" value="1">
                  <label for="star1">&#9733;</label>
                </div>
              </div>
              -->
              <div class="text-center">
                <button type="submit" class="add-review-btn" value="save">Submit Review</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Bootstrap JS -->
 
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
 {% endblock %}
</body>
</html>
