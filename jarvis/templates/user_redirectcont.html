<!DOCTYPE html>
{% extends "base.html" %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Submission Successful</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f8ff;
        }
        .confirmation-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .emoji {
            font-size: 60px;
            margin-bottom: 20px;
        }
        .checkmark {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #4CAF50;
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
            animation: pop 0.6s ease-out;
        }
        .checkmark::before {
            content: '';
            position: absolute;
            width: 15px;
            height: 30px;
            border-right: 5px solid white;
            border-bottom: 5px solid white;
            transform: rotate(45deg);
            top: 8px;
            left: 18px;
        }
        @keyframes pop {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
        .message {
            font-size: 20px;
            margin-bottom: 10px;
            color: #333;
        }
        .description {
            font-size: 16px;
            color: #777;
        }
        .btn-home {
            margin-top: 20px;
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .btn-home:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="confirmation-container">
        <div class="emoji">📧</div>
        <div class="checkmark"></div>
        <div class="message">Contact Submission Successful!</div>
        <div class="description">Thank you for reaching out! We will get back to you as soon as possible.</div>
        <a href="contact" class="btn-home">Go Back</a>
    </div>
</body>
</html>
