{% extends 'base.html' %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title_block %}{{ article.title }} {% endblock %}</title>
    {% block content %}
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Full-screen tech-styled background */
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #1d1f27, #131419); /* Subtle tech gradient */
            color: #d9d9d9; /* Soft light gray for text */
            font-family: 'Arial', sans-serif;
        }
    
        .full-screen-article {
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: left;
        }
    
        /* Article Title Styling */
        .article-title {
            font-size: 3rem;
            font-weight: bold;
            color: #4acfac; /* Tech green */
            margin-bottom: 20px;
            text-align: center; /* Center the title */
        }
    
        /* Article Image Styling */
        .article-image {
            width: 100%;
            max-width: 800px;
            max-height: 400px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }
    
        /* Article Meta (Date) Styling */
        .article-meta {
            font-size: 1rem;
            color: #aaaaaa; /* Light gray for meta text */
            margin-bottom: 20px;
            text-align: center;
        }
    
        /* Article Content Styling */
        .article-content {
            font-size: 1.2rem;
            line-height: 1.8;
            max-width: 800px;
            color: #e6e6e6; /* Softer white for better readability */
            text-align: justify; /* Justify text for cleaner layout */
            margin-bottom: 20px;
            word-wrap: break-word; /* Prevent overflow issues */
        }
    
        /* Adjusting images within the TinyMCE content */
        .article-content img {
            max-width: 100%; /* Ensure images are responsive */
            height: auto;
            display: block;
            margin: 20px auto; /* Center images */
            border-radius: 10px; /* Optional: rounded corners */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); /* Optional: subtle shadow for images */
        }
    
        /* Back Button Styling */
        .back-button {
            display: inline-block;
            background-color: #4acfac; /* Tech green */
            color: #1d1f27; /* Dark text on button */
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease-in-out;
            margin-bottom: 20px;
        }
    
        .back-button:hover {
            background-color: #3aa599; /* Darker green */
            color: white;
        }
    
        /* Responsive Design */
        @media (max-width: 768px) {
            .article-title {
                font-size: 2rem;
            }
    
            .article-content {
                font-size: 1rem;
            }
        }
    
        @media (max-width: 576px) {
            .article-content {
                padding: 5px; /* Reduce padding for very small devices */
            }
    
            .article-content img {
                margin: 10px 0; /* Further adjust margins for small screens */
            }
        }
    </style>
    
</head>
<body>

    <!-- Full-screen Article Section -->
    <div class="full-screen-article">
        <!-- Go Back Button -->
        <a href="javascript:history.back()" class="back-button">← Go Back</a>
    
        <!-- Article Title -->
        <h1 class="article-title">{{ article.title }}</h1>
    
        <!-- Article Image -->
        {% if article.image %}
        <img src="{{ article.image.url }}" alt="{{ article.title }}" class="article-image">
        {% endif %}
    
        <!-- Date Updated -->
        <p class="article-meta">Updated on {{ article.date_added|date:"F j, Y" }}</p>
    
        <!-- Article Content -->
        <div class="article-content">
            {{ article.post|safe }}
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% endblock %}
</body>
</html>
